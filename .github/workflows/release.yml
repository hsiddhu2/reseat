name: release
# Publishes to PyPI when a version tag is pushed. Uses PyPI trusted publishing:
# no token is stored in this repository. The owner registers this workflow once
# as a trusted publisher for the project "reseat" on pypi.org.
on:
  push:
    tags: ["v*"]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: The tag matches the package version
        shell: bash
        run: |
          want="${GITHUB_REF_NAME#v}"
          have="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          test "$want" = "$have" || { echo "tag $GITHUB_REF_NAME does not match version $have"; exit 1; }
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/reseat
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
