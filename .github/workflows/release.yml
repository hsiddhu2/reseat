name: release
# Publishes to PyPI when a version tag is pushed. Uses PyPI trusted publishing:
# no token is stored in this repository. The owner registers this workflow once
# as a trusted publisher for the project "reseat" on pypi.org.
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0   # v7.1.0
        with:
          python-version: "3.11"
      - name: The tag matches the package version
        shell: bash
        run: |
          want="${GITHUB_REF_NAME#v}"
          have="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          test "$want" = "$have" || { echo "tag $GITHUB_REF_NAME does not match version $have"; exit 1; }
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - name: Nothing private in the packages
        shell: bash
        run: |
          if tar tzf dist/*.tar.gz | grep -E '(^|/)(private/|\.claude/|CLAUDE\.md|\.DS_Store|uv\.lock|rules\.yaml)|\.db$'; then exit 1; fi
          if unzip -l dist/*.whl | grep -E '(private/|\.claude/|CLAUDE\.md|\.DS_Store|uv\.lock|rules\.yaml|\.db$)'; then exit 1; fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02   # v4
        with:
          name: dist
          path: dist/
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/reseat
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093   # v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086   # release/v1
