<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>re:Seat</title>
<style>
:root {
  --bg: #f5f7f8; --fg: #14202a; --muted: #5c6b77; --line: #d9e0e5; --card: #ffffff;
  --accent: #0b6a85; --ok: #1f7a4a; --warn: #9a5b00; --bad: #a12a2a; --soft: #e6f1f5;
  font: 17px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #0f161c; --fg: #e4eaef; --muted: #98a6b2; --line: #26333e; --card: #16202a;
          --accent: #5cc0dc; --ok: #6fd39c; --warn: #f0b660; --bad: #f08a8a; --soft: #15303a; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg);
       padding: calc(env(safe-area-inset-top, 0px) + 14px) 16px calc(env(safe-area-inset-bottom, 0px) + 24px); }
main { max-width: 34rem; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
h1 { margin: 0; font-size: 1.3rem; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
h2 { margin: 0 0 6px; font-size: .78rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.status { font-size: .8rem; font-weight: 500; padding: 2px 8px; border-radius: 99px; background: var(--soft); color: var(--ok); }
.status.down { color: var(--bad); }
.status.ro { color: var(--warn); }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
.leave { border-left: 4px solid var(--accent); }
.big { font-size: 2.1rem; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.1; }
.muted { color: var(--muted); font-size: .88rem; }
ol { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.row { display: grid; grid-template-columns: 3.4rem 1fr; gap: 10px; }
.time { font-variant-numeric: tabular-nums; font-weight: 600; }
.code { font-weight: 600; }
.verdict { font-weight: 700; text-transform: capitalize; }
.verdict.likely { color: var(--ok); } .verdict.early { color: var(--warn); } .verdict.unlikely { color: var(--bad); }
.actions { display: flex; gap: 8px; margin-top: 10px; }
button { font: inherit; flex: 1; padding: .7rem; border-radius: 8px; border: 1px solid var(--line);
         background: var(--card); color: var(--fg); }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
button:disabled { opacity: .5; }
button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.empty { color: var(--muted); font-size: .92rem; }
.log { font-size: .82rem; font-variant-numeric: tabular-nums; }
.log li { display: grid; grid-template-columns: 6.5rem 1fr; gap: 8px; }
.msg { font-size: .9rem; }
.msg.bad { color: var(--bad); }
</style>
</head>
<body>
<main>
  <h1>re:Seat <span id="status" class="status">loading</span></h1>
  <section class="card leave" id="leave-card" hidden>
    <h2>Leave now for</h2>
    <div><span class="code" id="leave-code"></span></div>
    <div class="big" id="leave-count"></div>
    <div class="muted" id="leave-how"></div>
  </section>
  <section id="proposals-sec" hidden>
    <h2>Proposed swaps</h2>
    <ol id="proposals"></ol>
  </section>
  <section>
    <h2 id="day-label">Held today</h2>
    <ol id="held"></ol>
  </section>
  <section id="advice-sec" hidden>
    <h2>Next wanted, not held</h2>
    <div class="card" id="advice"></div>
  </section>
  <section id="warn-sec" hidden>
    <h2>Venue switches</h2>
    <ol id="warnings"></ol>
  </section>
  <section>
    <h2>Journal</h2>
    <ol class="log" id="journal"></ol>
  </section>
  <p class="msg" id="msg" role="status"></p>
</main>
<script nonce="{{NONCE}}">
"use strict";
const $ = (id) => document.getElementById(id);
let state = null;
const inFlight = new Set();      // plan ids already sent: no second tap while one runs

function el(tag, attrs, ...children) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) n.setAttribute(k, v);
  for (const c of children) n.append(c instanceof Node ? c : document.createTextNode(c ?? ""));
  return n;
}

function render() {
  if (!state || !state.status) return;
  const s = state.status;
  const st = $("status");
  st.className = "status" + (s.online ? (s.read_only ? " ro" : "") : " down");
  st.textContent = !s.online ? "offline" : s.read_only ? "sign in needed" : "watching";

  const day = new Date(state.day + "T12:00:00");
  const today = new Date().toLocaleDateString("en-CA") === state.day;
  $("day-label").textContent = today ? "Held today" : "Held " + day.toLocaleDateString(undefined,
    { weekday: "long", month: "short", day: "numeric" });

  const held = $("held"); held.replaceChildren();
  if (!state.held.length) held.append(el("li", { class: "empty" }, "Nothing held that day."));
  for (const h of state.held) {
    held.append(el("li", { class: "card row" },
      el("span", { class: "time" }, h.start || ""),
      el("span", {}, el("span", { class: "code" }, h.code || ""), " ", h.title,
         el("div", { class: "muted" }, [h.venue, h.room].filter(Boolean).join(" · ")))));
  }

  const pr = $("proposals"); pr.replaceChildren();
  $("proposals-sec").hidden = !state.proposals.length;
  for (const p of state.proposals) {
    const approve = el("button", { class: "primary" }, "Approve");
    const skip = el("button", {}, "Skip");
    if (inFlight.has(p.plan_id)) { approve.disabled = true; skip.disabled = true; }
    approve.onclick = () => act("approve", p.plan_id, [approve, skip]);
    skip.onclick = () => act("skip", p.plan_id, [approve, skip]);
    pr.append(el("li", { class: "card" },
      el("div", {}, el("strong", {}, p.wanted)),
      el("div", { class: "muted" }, "instead of " + p.held),
      el("div", { class: "actions" }, approve, skip)));
  }

  const a = state.advice;
  $("advice-sec").hidden = !a;
  if (a) {
    $("advice").replaceChildren(
      el("div", {}, el("span", { class: "code" }, a.code || ""), " ", a.title),
      el("div", { class: "muted" }, [a.start, a.venue, a.room].filter(Boolean).join(" · ")),
      el("div", {}, el("span", { class: "verdict " + a.verdict }, a.verdict)),
      el("div", { class: "muted" }, a.basis));
  }

  const w = $("warnings"); w.replaceChildren();
  $("warn-sec").hidden = !state.warnings.length;
  for (const x of state.warnings) w.append(el("li", { class: "card muted" }, x));

  const j = $("journal"); j.replaceChildren();
  for (const e of state.journal) j.append(el("li", {}, el("span", { class: "muted" }, e.at), e.op + " " + (e.outcome || "")));
  tick();
}

function tick() {
  const l = state && state.next_leave;
  $("leave-card").hidden = !l;
  if (!l) return;
  $("leave-code").textContent = l.code;
  $("leave-how").textContent = l.how;
  const secs = Math.round(l.leave_at - Date.now() / 1000);
  $("leave-count").textContent = secs <= 0 ? "Go now" :
    (secs >= 3600 ? Math.floor(secs / 3600) + "h " : "") + Math.floor((secs % 3600) / 60) + "m " +
    String(secs % 60).padStart(2, "0") + "s";
}

async function load() {
  try {
    const r = await fetch("/api/state", { credentials: "same-origin" });
    if (r.status === 401) { location.href = "/login"; return; }
    if (!r.ok) throw new Error(r.status);
    state = await r.json();
    render();
  } catch (e) {
    $("status").className = "status down";
    $("status").textContent = "laptop unreachable";
  }
}

async function act(kind, planId, buttons) {
  if (inFlight.has(planId)) return;
  inFlight.add(planId);
  buttons.forEach((b) => (b.disabled = true));
  const msg = $("msg");
  msg.className = "msg"; msg.textContent = kind === "approve" ? "Running the swap..." : "Skipping...";
  try {
    const r = await fetch("/" + kind + "/" + encodeURIComponent(planId),
      { method: "POST", credentials: "same-origin", headers: { "X-Reseat": "1" } });
    const body = await r.json();
    if (r.status === 202) { msg.className = "msg bad"; msg.textContent = body.error; }
    else if (!r.ok) {
      msg.className = "msg bad";
      msg.textContent = body.error || "Not done.";
      if (body.kept) inFlight.delete(planId);       // not run: it can be approved again
    }
    else if (kind === "approve") {
      msg.className = "msg" + (body.state === "verified" ? "" : " bad");
      msg.textContent = body.alert || (body.reasons && body.reasons.length
        ? "Not run: " + body.reasons.join("; ") : "Swap " + body.state + ".");
    } else msg.textContent = "Skipped.";
  } catch (e) {
    msg.className = "msg bad"; msg.textContent = "No answer from the laptop. Check the journal before trying again.";
  }
  load();
}

load();
setInterval(load, 20000);
setInterval(tick, 1000);
</script>
</body>
</html>
