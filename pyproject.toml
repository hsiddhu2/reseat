[project]
name = "reseat"
version = "0.5.3"
description = "re:Seat keeps your AWS re:Invent seats: watches for freed seats and new repeats, books within your rules, swaps safely, and tells you when to leave."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Harpreet S. Siddhu" }]
keywords = ["aws", "reinvent", "events-api", "mcp", "schedule"]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "typer>=0.12",
    "keyring>=25",
    "rich>=13",
    "pyyaml>=6",
    "tzdata>=2024.1; sys_platform == 'win32'",   # Windows has no time zone database for zoneinfo
]

[project.urls]
Homepage = "https://github.com/hsiddhu2/reseat"
Demo = "https://hsiddhu2.github.io/reseat/"
Documentation = "https://github.com/hsiddhu2/reseat/blob/main/docs/architecture.md"
Issues = "https://github.com/hsiddhu2/reseat/issues"

[project.optional-dependencies]
mcp = ["mcp>=2.2,<3"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5", "mypy>=1.10", "mcp>=2.2,<3"]

[project.scripts]
reseat = "reseat.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reseat"]

# Only these go into the source package. Anything else in the folder never ships.
[tool.hatch.build.targets.sdist]
only-include = ["src", "tests", "docs", "demo", "scripts", "README.md", "LICENSE", "pyproject.toml"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
strict = true
python_version = "3.11"
